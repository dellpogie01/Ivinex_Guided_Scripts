<div class="FeatureScript_Page" name="Test">

    <!-- Hidden image to set the global "today" date -->
    <img src="x" style="display:none" onerror="
        // Current UTC time
        window.globalToday = new Date(Date.UTC(
            new Date().getUTCFullYear(),
            new Date().getUTCMonth(),
            new Date().getUTCDate(),
            new Date().getUTCHours(),
            new Date().getUTCMinutes(),
            new Date().getUTCSeconds()
        ));

        // US State abbreviation → IANA timezone mapping
        const stateTimeZones = {
            'AL':'America/Chicago','AK':'America/Anchorage','AZ':'America/Phoenix',
            'AR':'America/Chicago','CA':'America/Los_Angeles','CO':'America/Denver',
            'CT':'America/New_York','DE':'America/New_York','FL':'America/New_York',
            'GA':'America/New_York','HI':'Pacific/Honolulu','ID':'America/Boise',
            'IL':'America/Chicago','IN':'America/Indiana/Indianapolis','IA':'America/Chicago',
            'KS':'America/Chicago','KY':'America/New_York','LA':'America/Chicago',
            'ME':'America/New_York','MD':'America/New_York','MA':'America/New_York',
            'MI':'America/Detroit','MN':'America/Chicago','MS':'America/Chicago',
            'MO':'America/Chicago','MT':'America/Denver','NE':'America/Chicago',
            'NV':'America/Los_Angeles','NH':'America/New_York','NJ':'America/New_York',
            'NM':'America/Denver','NY':'America/New_York','NC':'America/New_York',
            'ND':'America/Chicago','OH':'America/New_York','OK':'America/Chicago',
            'OR':'America/Los_Angeles','PA':'America/New_York','RI':'America/New_York',
            'SC':'America/New_York','SD':'America/Chicago','TN':'America/Chicago',
            'TX':'America/Chicago','UT':'America/Denver','VT':'America/New_York',
            'VA':'America/New_York','WA':'America/Los_Angeles','WV':'America/New_York',
            'WI':'America/Chicago','WY':'America/Denver','DC':'America/New_York'
        };

        // Compute timezone based on the current state
        const stateInput = '[Field: state]';
        window.tz = stateTimeZones[stateInput] || 'UTC';

        // REUSABLE CALC FUNCTION
        window.calculateTimeDiff = function(formEl, inputName, outputName, unit) {

            const inputs = Array.from(formEl.querySelectorAll('input[name=' + inputName + ']'));
            const dateTimeInput = inputs.find(i => i.offsetParent !== null);
            const output = formEl.querySelector('output[name=' + outputName + ']');

            if (!window.globalToday || !window.tz || !dateTimeInput || !dateTimeInput.value) {
                if (output) output.value = 0;
                return;
            }

            unit = (unit || '').toLowerCase();
            if (unit === 'day') unit = 'days';
            if (unit === 'hour') unit = 'hours';

            const [datePart, timePart] = dateTimeInput.value.split('T');
            const [year, month, day] = datePart.split('-').map(Number);
            const [hour, minute] = timePart.split(':').map(Number);

            const utcGuess = Date.UTC(year, month - 1, day, hour, minute);

            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: window.tz,
                timeZoneName: 'shortOffset'
            });

            const parts = formatter.formatToParts(new Date(utcGuess));
            const tzPart = parts.find(p => p.type === 'timeZoneName').value;
            const match = tzPart.match(/GMT([+-]\d+)/);
            const offsetHours = match ? parseInt(match[1], 10) : 0;

            const inputUTC = new Date(utcGuess - (offsetHours * 60 * 60 * 1000));

            let diff;

            if (unit === 'days') {
                diff = (inputUTC - window.globalToday) / 86400000;
            } else if (unit === 'hours') {
                diff = (inputUTC - window.globalToday) / 3600000;
            } else {
                diff = 0;
            }

            output.value = diff.toFixed(2);
        };

        this.remove();
    ">

    <div class="FeatureScript_Section" name="Section_1">
        <div class="FeatureScript_Text">
            Q 7. When is your first available in person appointment for <strong>routine care</strong>?
            <br>
            <select name="NextRoutineAptDateTimeResponse" class="FeatureScript_Input" required>
                <option value=""></option>
                <option value="In Office">In Office</option>
            </select>
        </div>

            <form oninput="
                window.calculateTimeDiff(this, 
                    'NextRoutineAptDateTime', 
                    'NextRoutineCalc', 
                    'days'
                );
            ">

                <!-- In-person datetime --> 
                <div class="FeatureScript_Section" name="question7_inperson_datetime" DisplayWhen="([ScriptValue: NextRoutineAptDateTimeResponse] == 'In Office')">
                    <div class="FeatureScript_Text">
                        <input type="datetime-local" name="NextRoutineAptDateTime" class="FeatureScript_Input" required>
                    </div>
                </div>                
              
                <output class="FeatureScript_Input" name="NextRoutineCalc" hidden></output>
            </form>

        </div>
    </div>

    <div class="FeatureScript_Section" name="Section_2" DisplayWhen="([ScriptValue: NextRoutineAptDateTime] != '' && [ScriptValue: NextRoutineCalc] > 10)">
        >= 10
        <br>    
    </div>

    <div class="FeatureScript_Section" name="Section_3" DisplayWhen="([ScriptValue: NextRoutineAptDateTime] != '' && [ScriptValue: NextRoutineCalc] < 10)">
        <= 10
        <br>    
    </div>

</div>
